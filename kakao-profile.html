<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CODEFIT 카카오 채널 프로필 이미지 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Pretendard', sans-serif;
    background: #2a2a2a;
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  h1 { color: white; font-size: 24px; font-weight: 800; }
  p { color: #aaa; font-size: 14px; text-align: center; max-width: 600px; line-height: 1.6; }

  .picker {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 8px;
  }
  .picker button {
    background: #444;
    color: white;
    border: 2px solid #555;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .picker button.active {
    background: #FFD93D;
    color: #1a1a1a;
    border-color: #FFD93D;
  }

  .canvas-wrap {
    width: 640px;
    height: 640px;
    border: 2px dashed #555;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
    background: white;
  }
  canvas { display: block; width: 100%; height: 100%; }

  .download-btn {
    background: #FFD93D;
    color: #1a1a1a;
    border: 3px solid #1a1a1a;
    padding: 16px 40px;
    font-size: 18px;
    font-weight: 800;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 5px 5px 0 #C8102E;
    transition: all 0.15s;
  }
  .download-btn:hover {
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0 #C8102E;
  }

  .info {
    background: #1a1a1a;
    color: #ccc;
    padding: 20px 28px;
    border-radius: 12px;
    font-size: 13px;
    max-width: 600px;
    line-height: 1.7;
  }
  .info b { color: #FFD93D; }
</style>
</head>
<body>

<h1>CODEFIT 카카오 채널 프로필 이미지</h1>
<p>아래 디자인 중 마음에 드는 걸 선택하고 <b style="color:#FFD93D">PNG 다운로드</b> 버튼을 누르세요. 640x640 정사각형 이미지가 다운로드됩니다.</p>

<div class="picker" id="picker">
  <button class="active" data-design="1">디자인 1: 워드마크</button>
  <button data-design="2">디자인 2: 모노그램</button>
  <button data-design="3">디자인 3: 브래킷</button>
  <button data-design="4">디자인 4: 미니멀</button>
</div>

<div class="canvas-wrap">
  <canvas id="canvas" width="640" height="640"></canvas>
</div>

<button class="download-btn" id="download">⬇ PNG 다운로드 (640x640)</button>

<div class="info">
  <b>사용법</b><br>
  1. 디자인 4가지 중 선택<br>
  2. PNG 다운로드 버튼 클릭<br>
  3. 카카오 채널 관리자센터 → 프로필 사진 영역에 업로드<br><br>
  <b>팁</b> — 카카오톡 채널 프로필은 원형으로 표시되므로, 텍스트가 정사각형 중앙에 들어가도록 디자인했습니다. 4개 모두 작게 표시될 때(채팅 목록 등) 가독성을 우선했습니다.
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 640, H = 640;

// 색상 팔레트
const YELLOW = '#FFD93D';
const BLACK = '#1a1a1a';
const RED = '#C8102E';
const CREAM = '#FFF8E7';

function clear() {
  ctx.clearRect(0, 0, W, H);
}

// === 디자인 1: 워드마크 (CODEFIT 풀 텍스트) ===
function design1() {
  clear();
  // 노란 배경
  ctx.fillStyle = YELLOW;
  ctx.fillRect(0, 0, W, H);

  // 검정 둘러싼 테두리
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 16;
  ctx.strokeRect(8, 8, W-16, H-16);

  // 메인 텍스트 "CODEFIT"
  ctx.fillStyle = BLACK;
  ctx.font = '900 110px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.letterSpacing = '-4px';
  // CODEFIT
  const text = 'CODEFIT';
  const metrics = ctx.measureText(text);
  ctx.fillText(text, W/2, H/2 - 30);

  // 빨간 점
  const periodX = W/2 + metrics.width/2 + 10;
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(periodX, H/2 + 30, 14, 0, Math.PI * 2);
  ctx.fill();

  // 서브 텍스트
  ctx.fillStyle = BLACK;
  ctx.font = '700 32px Pretendard, sans-serif';
  ctx.fillText('자영업 맞춤 시스템', W/2, H/2 + 80);

  // 상단 작은 태그
  ctx.fillStyle = BLACK;
  ctx.fillRect(W/2 - 110, 110, 220, 56);
  ctx.fillStyle = YELLOW;
  ctx.font = '900 26px Pretendard, sans-serif';
  ctx.fillText('CUSTOM CODE', W/2, 138);
}

// === 디자인 2: 모노그램 (CF) ===
function design2() {
  clear();
  // 검정 배경
  ctx.fillStyle = BLACK;
  ctx.fillRect(0, 0, W, H);

  // 노란 큰 사각형 (좌상)
  ctx.fillStyle = YELLOW;
  ctx.fillRect(60, 60, 240, 240);

  // C 글자 (검정)
  ctx.fillStyle = BLACK;
  ctx.font = '900 220px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('C', 180, 190);

  // 빨간 큰 사각형 (우하)
  ctx.fillStyle = RED;
  ctx.fillRect(340, 340, 240, 240);

  // F 글자 (흰색)
  ctx.fillStyle = '#fff';
  ctx.fillText('F', 460, 470);

  // 가운데 작은 라벨
  ctx.fillStyle = YELLOW;
  ctx.font = '900 24px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('CODEFIT', W/2, H - 40);
}

// === 디자인 3: 브래킷 { } ===
function design3() {
  clear();
  // 크림 배경
  ctx.fillStyle = CREAM;
  ctx.fillRect(0, 0, W, H);

  // 두꺼운 검정 테두리
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 12;
  ctx.strokeRect(6, 6, W-12, H-12);

  // 노란 강조 박스 (배경)
  ctx.fillStyle = YELLOW;
  ctx.fillRect(80, 230, W-160, 180);

  // { } 브래킷
  ctx.fillStyle = BLACK;
  ctx.font = '900 280px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('{ }', W/2, H/2);

  // 상단 텍스트
  ctx.font = '900 56px Pretendard, sans-serif';
  ctx.fillText('CODEFIT', W/2, 130);

  // 하단 텍스트
  ctx.font = '700 28px Pretendard, sans-serif';
  ctx.fillStyle = RED;
  ctx.fillText('맞춤 시스템 제작', W/2, H - 100);
}

// === 디자인 4: 미니멀 ===
function design4() {
  clear();
  // 노란 배경
  ctx.fillStyle = YELLOW;
  ctx.fillRect(0, 0, W, H);

  // 큰 CODEFIT
  ctx.fillStyle = BLACK;
  ctx.font = '900 130px Pretendard, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const text = 'CODEFIT';
  const metrics = ctx.measureText(text);
  ctx.fillText(text, W/2, H/2);

  // 빨간 큰 점
  const periodX = W/2 + metrics.width/2 + 15;
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.arc(periodX, H/2 + 50, 22, 0, Math.PI * 2);
  ctx.fill();

  // 하단 라인
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(W/2 - 60, H/2 + 110);
  ctx.lineTo(W/2 + 60, H/2 + 110);
  ctx.stroke();
}

const designs = { 1: design1, 2: design2, 3: design3, 4: design4 };
let current = 1;

function render() {
  designs[current]();
}

// 폰트 로드 후 렌더링
document.fonts.ready.then(() => {
  render();
});
render();

// 디자인 선택
document.getElementById('picker').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#picker button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  current = btn.dataset.design;
  render();
});

// 다운로드
document.getElementById('download').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = `codefit-kakao-profile-${current}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>

</body>
</html>
